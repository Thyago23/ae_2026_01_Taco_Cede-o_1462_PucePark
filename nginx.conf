events {
    worker_connections 1024;
}

http {
    # DNS embebido de Docker: permite re-resolver el nombre del contenedor en runtime,
    # así nginx no se rompe (502) cuando se reconstruye/recrea un servicio y cambia su IP.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        # ── Microservicio de usuarios (perfiles) → users-service:8686 ──
        location /users/ {
            set $users_upstream http://users-service:8686;
            proxy_pass         $users_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   Authorization      $http_authorization;
            proxy_pass_header  Authorization;
        }

        # ── API principal de parqueo → park-app:8080 ──
        location /api/ {
            set $park_upstream http://park-app:8080;
            proxy_pass         $park_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   Authorization      $http_authorization;
            proxy_pass_header  Authorization;
        }

        # ── Panel web de administración (estático) ──
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # La raíz redirige al panel de administración
        location = / {
            return 302 /admin/;
        }

        # Fallback
        location / {
            return 404 '{"error":"Not found"}';
            add_header Content-Type application/json;
        }
    }
}
