services:

  # ── Base de datos 1: Parqueo principal ────────────────────────────────────────
  db_park:
    image: postgres:16-alpine
    container_name: puce_park_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PARK_PASSWORD:-password}
      POSTGRES_DB: puce_park
    ports:
      - "5434:5432"
    volumes:
      - db_park_data:/var/lib/postgresql/data
    networks:
      - park_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d puce_park"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Base de datos 2: Microservicios ───────────────────────────────────────────
  db_micro:
    image: postgres:16-alpine
    container_name: puce_micro_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_MICRO_PASSWORD:-password}
      POSTGRES_DB: puce_micro
    ports:
      - "5435:5432"
    volumes:
      - db_micro_data:/var/lib/postgresql/data
    networks:
      - park_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d puce_micro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Aplicación Spring Boot principal ──────────────────────────────────────────
  park-app:
    build: .
    container_name: puce_park_backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_park:5432/puce_park
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PARK_PASSWORD:-password}
    depends_on:
      db_park:
        condition: service_healthy
    networks:
      - park_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── Microservicio: Usuarios / Perfiles ────────────────────────────────────────
  users-service:
    build: ./users-service
    container_name: puce_users_backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_micro:5432/puce_micro
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_MICRO_PASSWORD:-password}
    depends_on:
      db_micro:
        condition: service_healthy
    networks:
      - park_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8686/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── Nginx: reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: puce_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webadmin:/usr/share/nginx/html/admin:ro
    depends_on:
      - park-app
      - users-service
    networks:
      - park_net
    restart: unless-stopped

volumes:
  db_park_data:
  db_micro_data:

networks:
  park_net:
    driver: bridge
